spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:syncspace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456789}
    expiration-ms: 86400000
